name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Read-only token: the jobs only check out code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python_backend/requirements.txt
            python_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
        env:
          # Dummy values: the Supabase client needs a URL to be created; tests never call it.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test
      - run: npm run lint
